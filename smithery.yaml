# Smithery configuration for Olist Tiny ERP
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_olist

name: olist-mcp
displayName: "Olist Tiny ERP"
description: >
  ERP de e-commerce Olist Tiny (ex-Tiny ERP) com a API REST oficial v3 completa, produtos, estoque, pedidos, notas fiscais (NF-e/NFC-e), contas a pagar e receber, contatos, expedição, ordens de compra e serviço, CRM e listas de preços. Consulta e operação. Pareia com o Banco MCP para conciliar banco e ERP. Você cria o aplicativo na sua conta Olist e autoriza com OAuth.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/olist-mcp
repository: https://github.com/mcp-dir/olist-mcp

tags:
  - olist
  - brazil
  - fin
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_olist

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_olist/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
